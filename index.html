<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Themenboard RBL / INFRA</title>
<style>
:root{
  --bg:#f4f6f8;--surface:#fff;--ink:#16202a;--muted:#5f6d7a;--line:#dde3e9;
  --brand:#0BA1E2;--brand-d:#0886BD;--brand-soft:#e6f5fc;
  --red:#c62828;--red-soft:#fdecea;--amber:#b45309;--amber-soft:#fff4e0;--green:#1b7f4b;--green-soft:#e6f4ec;--violet:#6b4fd3;--violet-soft:#efeafc;
}
@media (prefers-color-scheme:dark){:root{--bg:#10161c;--surface:#18212a;--ink:#e8eef3;--muted:#9aa8b5;--line:#2a3643;--brand:#3cb8ec;--brand-d:#7ccdf3;--brand-soft:#133040;--red:#f28b82;--red-soft:#3f1f1d;--amber:#f0b35c;--amber-soft:#3a2c13;--green:#7fcf9f;--green-soft:#1a3326;--violet:#b3a1f5;--violet-soft:#2a2347}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:16px;margin:0}
.badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--brand-soft);color:var(--brand-d);padding:3px 9px;border-radius:99px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 20px 0;max-width:1300px;margin:0 auto}
.tabs button{border:1px solid var(--line);border-bottom:0;background:transparent;color:var(--muted);padding:9px 14px;font:inherit;font-size:13px;font-weight:600;border-radius:9px 9px 0 0;cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);border-color:var(--line)}
.wrap{max-width:1300px;margin:0 auto;padding:0 20px 50px}
.panel{display:none;background:var(--surface);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:18px}
.panel.on{display:block}
h2{font-size:15px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:3px 8px;font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.red{color:var(--red);background:var(--red-soft);border-color:transparent}
.chip.amber{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.chip.green{color:var(--green);background:var(--green-soft);border-color:transparent}
.chip.brand{color:var(--brand-d);background:var(--brand-soft);border-color:transparent}
.chip.violet{color:var(--violet);background:var(--violet-soft);border-color:transparent}
.av{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16202a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw}
.toast.on{opacity:1}

/* Aufbau */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.lvl{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);position:relative}
.lvl b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-d);margin-bottom:4px}
.lvl h3{margin:0 0 4px;font-size:14px}
.lvl p{margin:0;font-size:12.5px;color:var(--muted)}
.lvl:not(:last-child)::after{content:"→";position:absolute;right:-10px;top:50%;transform:translateY(-50%);background:var(--surface);border:1px solid var(--line);border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;z-index:2}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:13px}
.card ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.card li{margin-bottom:3px}
.rule{border-left:4px solid var(--brand);background:var(--brand-soft);padding:9px 12px;border-radius:0 8px 8px 0;font-size:12.5px;margin:12px 0}

/* Landkarte */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface);text-align:left;font:inherit;color:inherit}
.kpi:hover,.kpi.on{border-color:var(--brand)}
.kpi b{display:block;font-size:22px;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.warn b{color:var(--red)}.kpi.amb b{color:var(--amber)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters .chip{cursor:pointer;background:var(--surface)}
.filters .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.feld{margin-bottom:14px}
.feld-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.feld-h i{flex:1;height:1px;background:var(--line)}
.trow{display:grid;grid-template-columns:30px minmax(0,2.2fr) 150px minmax(0,2fr) 110px;gap:10px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;background:var(--surface)}
.trow:hover{border-color:var(--brand)}
.trow.late{border-left-color:var(--red)}
.trow.stale{border-left-color:var(--amber)}
.prio{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
.prio.A{background:var(--red)}.prio.B{background:var(--amber)}.prio.C{background:#7a8794}
.tt{font-weight:700;font-size:13.5px}
.tm{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.who{display:flex;align-items:center;gap:6px;font-size:12.5px}
.who.none{color:var(--red);font-weight:700}
.nx{font-size:12.5px}
.nx small{display:block;color:var(--muted);font-size:11px}
.nx .d.l{color:var(--red);font-weight:700}
.phase{display:flex;gap:2px}
.phase i{width:16px;height:6px;border-radius:2px;background:var(--line)}
.phase i.f{background:var(--brand)}

/* Akte */
.akte{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
.akte h2.big{font-size:19px;margin-bottom:6px}
.blk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.blk h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{flex:1;min-width:90px;text-align:center;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:6px 4px;color:var(--muted)}
.steps span.f{background:var(--brand-soft);color:var(--brand-d);border-color:transparent}
.steps span.now{background:var(--brand);color:#fff;border-color:var(--brand)}
.next{border:2px solid var(--brand);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--brand-soft)}
.next.late{border-color:var(--red);background:var(--red-soft)}
.next .l{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-d)}
.next.late .l{color:var(--red)}
.next .tx{font-size:15px;font-weight:700;margin:3px 0}
table.ap{width:100%;border-collapse:collapse;font-size:12.5px}
table.ap th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
table.ap td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl div{position:relative;margin-bottom:10px;font-size:12.5px}
.tl div::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.tl div.info::before{background:var(--muted)}
.tl small{color:var(--muted);display:block}
.raci{display:grid;grid-template-columns:28px 1fr auto;gap:6px 8px;align-items:center;font-size:12.5px}
.raci .r{width:22px;height:22px;border-radius:6px;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.r.V{background:var(--brand)}.r.M{background:var(--violet)}.r.I{background:#7a8794}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-top:8px}
.sw{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:0;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--green)}.sw.on::after{left:18px}

/* Extern */
.ext-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ext-bar select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink)}
.ext{border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:820px;margin:0 auto;background:var(--bg)}
.ext-h{background:#16202a;color:#fff;padding:14px 18px}
.ext-h b{font-size:15px}
.ext-h small{display:block;opacity:.75;font-size:12px}
.ext-b{padding:14px 18px}
.ext-g{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin:14px 0 6px;color:var(--muted)}
.ext-g.late{color:var(--red)}
.ec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.ec.late{border-left-color:var(--red)}
.ec .t{font-weight:700;font-size:14px}
.ec .ask{margin:6px 0;font-size:13px}
.ec details{font-size:12.5px;color:var(--muted);margin:4px 0}
.ec details summary{cursor:pointer;color:var(--brand-d);font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.form{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.form.on{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.form input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;flex:1;min-width:160px;background:var(--surface);color:var(--ink)}
.ec.done{opacity:.55}

/* Wochenrunde */
.rev{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.rev h3{margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center}
.ri{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:7px 0;font-size:13px}
.ri small{color:var(--muted);display:block;font-size:11.5px}
.ri .a{display:flex;gap:5px;flex-wrap:wrap}
@media(max-width:900px){.flow,.grid3,.kpis{grid-template-columns:1fr 1fr}.akte{grid-template-columns:1fr}.trow{grid-template-columns:30px 1fr}.trow>*:nth-child(n+3){grid-column:2}.lvl::after{display:none}}
#p-import table.ap{display:block;overflow-x:auto}
@media(max-width:760px){#p-import .kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}#p-import .grid3{grid-template-columns:1fr}.tabs{overflow-x:auto}}
/* App-Zusätze */
.top .sp{flex:1}
.top a.lnk{color:var(--brand-d);font-size:12.5px;text-decoration:none;font-weight:600}
.tabs button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;line-height:17px;text-align:center}
.tabs button .n.z{background:var(--line);color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;resize:vertical;min-height:54px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.lbl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 0 3px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2>input{flex:1;min-width:120px}
.btn.del{color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:default}
.kpi.on{background:var(--brand-soft)}
.empty{color:var(--muted);font-size:13px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.ttl{font-size:19px;font-weight:700;width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;margin-left:-6px}
.ttl:hover,.ttl:focus{border-color:var(--line);background:var(--surface)}
.pbtn{display:inline-flex;gap:4px}.pbtn button{width:30px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;cursor:pointer}
.pbtn button.on.A{background:var(--red);color:#fff;border-color:var(--red)}.pbtn button.on.B{background:var(--amber);color:#fff;border-color:var(--amber)}.pbtn button.on.C{background:#7a8794;color:#fff;border-color:#7a8794}
.steps span{cursor:pointer}
.steps span:hover{border-color:var(--brand)}
table.ap input,table.ap select{width:100%;padding:3px 5px;font-size:12.5px}
table.ap td.x{width:28px;text-align:center}
.pill{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--line);color:var(--muted)}
.pill.laeuft{background:var(--brand-soft);color:var(--brand-d)}.pill.erledigt{background:var(--green-soft);color:var(--green)}.pill.idee{background:var(--violet-soft);color:var(--violet)}
.ptr{border-top:1px solid var(--line);padding:6px 0;font-size:12.5px}
.ptr:first-child{border-top:0}
.ptr small{color:var(--muted);display:block}
.rm{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.rm.done{opacity:.55;border-left-color:var(--green)}
.rm .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.rm .tx{margin:6px 0;font-size:13.5px}
.modal{position:fixed;inset:0;background:rgba(10,18,26,.5);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--surface);border-radius:14px;padding:16px 18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal h3{margin:0 0 8px;font-size:15px}
.zlink{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;word-break:break-all;margin:6px 0}
.note{font-size:12px;color:var(--muted)}
.err{color:var(--red);font-size:12.5px}
@media(max-width:900px){.top{padding:10px 12px}.tabs,.wrap{padding-left:10px;padding-right:10px}.tabs{overflow-x:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap}}
#modal2{z-index:50}
.apl{display:flex;flex-direction:column;gap:8px}
.apc{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)}
.apc .r1{display:flex;gap:6px;align-items:flex-start}
.apc .r2{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.apc .nr{width:62px;flex:none;font-weight:700}
.apc .inh{flex:1;min-width:0;resize:vertical;font:inherit;font-size:13px;line-height:1.35;padding:5px 7px;min-height:44px}
.apc .r2 select,.apc .r2 input{padding:4px 6px;font-size:12.5px}
.apc .r2 select[data-apf=wer]{flex:2;min-width:150px}
.apc .r2 .bud{flex:1;min-width:90px;max-width:130px}
.apc .r2 select[data-apf=stand]{flex:1;min-width:90px}
</style>
</head>
<body>
<div class="top"><h1>Themenboard · RBL / INFRA</h1><span class="badge">Themenregister</span><span class="sp"></span><span class="note" id="stand"></span><a class="lnk" href="https://innotechleipziggmbh.github.io/innotech-protokoll/" target="_blank" rel="noopener">Protokoll ↗</a></div>

<script>
"use strict";
const SB = "https://beszfzvxtfwdzimixdbo.supabase.co";
const KEY = "sb_publishable_onY7q5GNCGOxkEuzEOySDA_XyIqR6Rw";
const PROJ = "proj-rbl-infra";
const ORDNER = "ordner-1786692984103";
const STALE_DAYS = 21;
const PHASEN = [["idee", "Idee"], ["skizze", "Skizze"], ["beauftragt", "Beauftragt"], ["umsetzung", "Umsetzung"], ["betrieb", "Betrieb"]];
const FELDER = ["Wasser", "Wärme und Energie", "Rasen", "GLT und Betrieb", "Strom und Medien", "Digitalisierung", "Liegenschaften", "Allgemein"];
// Gleiche feste Liste wie im Statusboard (Auswahlvorschlag für INNOTECH-Personen)
const INNOTECH_STAFF = ["Britta Riedel", "Marcus Riedel", "Stefan Riedel", "Maximilian Fehst", "Henryk Fehst", "Daniel Hentschel", "Michael Bonitz", "Julia Albert", "Maximilian Roth", "Anh Nguyen"];
const PL_INNOTECH = ["Marcus Riedel", "Stefan Riedel", "Maximilian Fehst", "Henryk Fehst"];
const GEWERKE = ["PL INNOTECH", "PL Kunde", "Bauleitung", "Architektur", "Statik", "Elektro", "TGA / HLS", "Sanitär", "Brandschutz", "Fassade", "Sonstiges"];
const AP_STAND = [["idee", "Idee"], ["offen", "offen"], ["laeuft", "läuft"], ["erledigt", "erledigt"]];

// ---------- Hilfsfunktionen ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const pd = s => { if (!s) return null; const m = String(s).slice(0, 10).match(/^(\d{4})-(\d\d)-(\d\d)$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const fmt = s => { const d = pd(s); return d ? String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear() : ""; };
const addDays = (s, n) => { const d = pd(s) || new Date(TODAY); d.setDate(d.getDate() + n); return iso(d); };
const daysSince = ts => { if (!ts) return 9999; const d = new Date(ts); d.setHours(0, 0, 0, 0); return Math.round((TODAY - d) / 864e5); };
const COL = ["#0BA1E2", "#6b4fd3", "#1b7f4b", "#c2410c", "#a21caf", "#0f766e", "#b45309"];
const colOf = n => COL[[...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % COL.length];
const ini = n => String(n).trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const av = n => `<span class="av" style="background:${colOf(n)}">${esc(ini(n))}</span>`;
const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || "").trim().toLowerCase();

let session = null; // nur für die Verwaltung der externen Zugänge
function hdrs(extra) {
  const h = { apikey: KEY, Authorization: "Bearer " + ((session && session.access_token) || KEY), "Content-Type": "application/json" };
  return Object.assign(h, extra || {});
}
async function api(path, opt = {}) {
  const r = await fetch(SB + "/rest/v1/" + path, Object.assign({}, opt, { headers: hdrs(opt.headers) }));
  if (!r.ok) { let m = ""; try { m = (await r.json()).message; } catch (e) { } throw new Error(m || ("HTTP " + r.status)); }
  if (r.status === 204) return null;
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
async function rpc(name, body) {
  const r = await fetch(SB + "/rest/v1/rpc/" + name, { method: "POST", headers: hdrs(), body: JSON.stringify(body || {}) });
  if (!r.ok) { let m = ""; try { m = (await r.json()).message; } catch (e) { } throw new Error(m || ("HTTP " + r.status)); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
function toast(m, err) { const t = $("#toast"); t.textContent = m; t.style.background = err ? "#b3261e" : ""; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), err ? 5000 : 2600); }

// ---------- Daten ----------
const S = { themen: [], bet: [], ap: [], verl: [], rm: [], todos: [], proto: [], apers: [], kont: [] };
let sel = null, tab = "karte", fKpi = null, fLieg = "alle", zugaenge = null;

async function loadAll(silent) {
  try {
    const pq = "protokolle?select=id,updated_at,meta:data->meta,rows:data->data,secs:data->sections&gf_only=eq.false&" + encodeURIComponent("data->meta->>ordner_id") + "=eq." + ORDNER;
    const [t, b, a, v, r, td, pr, ape, kon] = await Promise.all([
      api("themen?select=*&order=pos.asc,created_at.asc"),
      api("thema_beteiligte?select=*&order=pos.asc"),
      api("thema_ap?select=*&order=pos.asc"),
      api("thema_verlauf?select=*&order=datum.desc,created_at.desc&limit=1500"),
      api("thema_rueckmeldung?select=*&order=created_at.desc&limit=300"),
      api("projekt_todos?select=*&thema_id=not.is.null&order=created_at.asc"),
      api(pq).catch(() => []),
      api("projekt_ansprechpartner?select=*&order=pos.asc&projekt_id=eq." + encodeURIComponent(PROJ)).catch(() => []),
      api("kontakte?select=id,name,firma,email,telefon&order=name.asc").catch(() => [])
    ]);
    S.themen = t || []; S.bet = b || []; S.ap = a || []; S.verl = v || []; S.rm = r || []; S.todos = td || []; S.proto = pr || []; S.apers = ape || []; S.kont = kon || [];
    $("#stand").textContent = "Stand " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    $("#loaderr").style.display = "none";
  } catch (e) {
    if (!silent) { $("#loaderr").textContent = "Daten konnten nicht geladen werden: " + e.message; $("#loaderr").style.display = "block"; }
    return false;
  }
  return true;
}
const T = id => S.themen.find(t => t.id === id);
const betOf = id => S.bet.filter(b => b.thema_id === id);
const apOf = id => S.ap.filter(a => a.thema_id === id);
const verlOf = id => S.verl.filter(v => v.thema_id === id);
const rmOf = id => S.rm.filter(r => r.thema_id === id);
const todosOf = id => S.todos.filter(x => x.thema_id === id);
function protoPoints(id) {
  const out = [];
  S.proto.forEach(p => {
    const labels = {}; (p.secs || []).forEach(s => labels[s.key] = s.label);
    Object.keys(p.rows || {}).forEach(k => (p.rows[k] || []).forEach(r => {
      if (r && r.themaId === id) out.push({ pid: p.id, datum: (p.meta && p.meta.datum) || "", nr: p.meta && p.meta.nr, typ: (p.meta && p.meta.typ) || "", sec: labels[k] || "", row: r });
    }));
  });
  return out.sort((a, b) => String(b.datum).localeCompare(String(a.datum)));
}
function lastMove(t) {
  let m = new Date(t.letzte_bewegung).getTime() || 0;
  protoPoints(t.id).forEach(p => { const d = pd(p.datum); if (d) m = Math.max(m, d.getTime()); });
  todosOf(t.id).forEach(x => { const d = new Date(x.updated_at).getTime(); if (d) m = Math.max(m, d); });
  return m;
}

// ---------- Ableitungen ----------
const isOpen = t => t.status === "offen";
const isLate = t => isOpen(t) && t.naechster_termin && pd(t.naechster_termin) < TODAY;
const stillDays = t => Math.max(0, Math.round((TODAY - new Date(new Date(lastMove(t)).setHours(0, 0, 0, 0))) / 864e5));
const wvOk = t => !t.wiedervorlage || pd(t.wiedervorlage) <= TODAY;
const isStale = t => isOpen(t) && stillDays(t) >= STALE_DAYS && wvOk(t);
const noK = t => isOpen(t) && !t.kuemmerer;
const noStep = t => isOpen(t) && !t.naechster_schritt;
const wvDue = t => isOpen(t) && t.wiedervorlage && pd(t.wiedervorlage) <= TODAY;
const rmOpen = () => S.rm.filter(r => !r.bearbeitet);
const KPI = {
  offen: { l: "Themen offen", f: t => isOpen(t), c: "" },
  late: { l: "überfällig", f: isLate, c: "warn" },
  noK: { l: "ohne Kümmerer", f: noK, c: "warn" },
  stale: { l: "seit " + STALE_DAYS + " Tagen unbewegt", f: isStale, c: "amb" },
  noStep: { l: "ohne nächsten Schritt", f: noStep, c: "amb" }
};

function people() {
  const m = new Map();
  const add = (n, f) => { n = (n || "").trim(); if (!n || /^(alle|innotech.*|rbl|siemens|b-plan|blauig)$/i.test(n)) return; if (!m.has(n) || (!m.get(n) && f)) m.set(n, f || m.get(n) || ""); };
  // Quelle ist das Statusboard (Ansprechpartner des Projekts), dazu die feste INNOTECH-Liste
  S.apers.forEach(a => { const k = S.kont.find(x => x.id === a.kontakt_id); if (k) m.set(k.name.trim(), k.firma || ""); });
  INNOTECH_STAFF.forEach(n => { if (!m.has(n)) m.set(n, "INNOTECH Leipzig GmbH"); });
  S.bet.forEach(b => add(b.name, b.firma));
  S.themen.forEach(t => { add(t.kuemmerer, t.kuemmerer_firma); add(t.naechster_wer, ""); });
  if (zugaenge) zugaenge.forEach(z => add(z.name, z.firma));
  return [...m.entries()].map(([name, firma]) => ({ name, firma })).sort((a, b) => a.name.localeCompare(b.name, "de"));
}
const firmaOf = n => { const p = people().find(x => norm(x.name) === norm(n)); return p ? p.firma : ""; };
const dlPeople = () => "";
const firmen = () => [...new Set(people().map(p => p.firma).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
// Auswahlfeld statt Freitext. Ein früher eingetragener Wert, der nicht in der Liste steht, bleibt als "bisher" sichtbar.
function personSel(attrs, cur, o) {
  o = o || {}; cur = cur || "";
  const ps = people(), known = ps.some(p => p.name === cur) || (o.firmen && firmen().includes(cur));
  const grp = o.firmen ? `<optgroup label="Personen">` : "", end = o.firmen ? `</optgroup>` : "";
  const popts = ps.map(p => `<option value="${esc(p.name)}"${p.name === cur ? " selected" : ""}>${esc(p.name)}${p.firma ? " · " + esc(p.firma) : ""}</option>`).join("");
  const fopts = o.firmen ? `<optgroup label="Firmen">${firmen().map(f => `<option value="${esc(f)}"${f === cur ? " selected" : ""}>${esc(f)}</option>`).join("")}</optgroup>` : "";
  const old = cur && !known ? `<option value="${esc(cur)}" selected>bisher: ${esc(cur)}</option>` : "";
  return `<select ${attrs}><option value="">${esc(o.empty || "– Person wählen –")}</option>${old}${grp}${popts}${end}${fopts}<option value="__new__">+ Neue Person anlegen …</option></select>`;
}

// ---------- Schreiben ----------
async function patchThema(id, f, log) {
  const row = await api("themen?id=eq." + id, { method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify(f) });
  if (row && row[0]) Object.assign(T(id), row[0]);
  if (log) await addVerlauf(id, "Änderung", log);
}
async function addVerlauf(id, quelle, text, datum) {
  const r = await api("thema_verlauf", { method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify({ thema_id: id, quelle, text, datum: datum || iso(TODAY) }) });
  if (r && r[0]) S.verl.unshift(r[0]);
  const t = T(id); if (t) t.letzte_bewegung = new Date().toISOString();
}
async function guard(fn) { try { await fn(); } catch (e) { toast("Speichern fehlgeschlagen: " + e.message, true); await loadAll(true); } render(); }

// ---------- Landkarte ----------
let showDone = false;
function renderKarte() {
  const act = S.themen.filter(isOpen);
  const liegs = [...new Set(S.themen.flatMap(t => t.liegenschaften || []))].sort((a, b) => a.localeCompare(b, "de"));
  const kp = Object.entries(KPI).map(([k, d]) => `<button class="kpi ${d.c}${fKpi === k ? " on" : ""}" data-k="${k}"><b>${act.filter(d.f).length}</b><span>${d.l}</span></button>`).join("");
  const chips = ["alle", ...liegs].map(l => `<span class="chip${fLieg === l ? " on" : ""}" data-l="${esc(l)}">${l === "alle" ? "Alle Liegenschaften" : esc(l)}</span>`).join("") +
    `<span class="chip${showDone ? " on" : ""}" data-showdone="1" style="margin-left:auto">auch erledigte</span>`;
  let list = S.themen.filter(t => showDone || isOpen(t));
  if (fKpi && fKpi !== "offen") list = list.filter(KPI[fKpi].f);
  if (fLieg !== "alle") list = list.filter(t => (t.liegenschaften || []).includes(fLieg));
  const felder = [...FELDER, ...new Set(list.map(t => t.handlungsfeld).filter(f => !FELDER.includes(f)))];
  const pr = { A: 0, B: 1, C: 2 };
  let html = "";
  felder.forEach(f => {
    const rows = list.filter(t => t.handlungsfeld === f).sort((a, b) => (isOpen(b) - isOpen(a)) || (pr[a.prio] - pr[b.prio]) || ((isLate(b) ? 1 : 0) - (isLate(a) ? 1 : 0)) || a.titel.localeCompare(b.titel, "de"));
    if (!rows.length) return;
    html += `<div class="feld"><div class="feld-h">${esc(f)} <span class="chip">${rows.length}</span><i></i></div>${rows.map(trow).join("")}</div>`;
  });
  if (!html) html = `<div class="empty">Keine Themen für diesen Filter.</div>`;
  $("#p-karte").innerHTML = `<h2>Themenlandkarte</h2><p class="sub">Alle Themen nach Handlungsfeld. Rot: überfällig oder kein Kümmerer. Orange: lange nicht bewegt. Klick auf ein Thema öffnet die Themenakte.</p>
    <div class="kpis">${kp}</div><div class="filters">${chips}</div>${html}`;
}
function trow(t) {
  const late = isLate(t), stale = isStale(t), nk = noK(t), sd = stillDays(t);
  const ph = Math.max(0, PHASEN.findIndex(p => p[0] === t.phase));
  const phase = `<span class="phase">${PHASEN.map((p, i) => `<i class="${i <= ph ? "f" : ""}"></i>`).join("")}</span>`;
  const who = t.kuemmerer ? `<div class="who">${av(t.kuemmerer)}<span>${esc(t.kuemmerer)}<br><small class="note">${esc(t.kuemmerer_firma || "")}</small></span></div>`
    : `<div class="who none">⚠ kein Kümmerer${t.kuemmerer_firma ? `<small class="note" style="font-weight:400">nur ${esc(t.kuemmerer_firma)}</small>` : ""}</div>`;
  let nx;
  if (!isOpen(t)) nx = `<div class="nx"><small>${t.status === "erledigt" ? "erledigt" : "archiviert"}</small></div>`;
  else if (t.naechster_schritt) {
    const d = pd(t.naechster_termin);
    const days = d ? Math.round((TODAY - d) / 864e5) : 0;
    nx = `<div class="nx">${esc(t.naechster_schritt)}<small>${d ? (late ? `<span class="d l">überfällig seit ${fmt(t.naechster_termin)}</span>` : `bis ${fmt(t.naechster_termin)}`) : `<span style="color:var(--amber)">ohne Termin</span>`}${t.naechster_wer ? " · " + esc(t.naechster_wer) : ""}</small></div>`;
  } else nx = `<div class="nx" style="color:var(--amber);font-weight:700">kein nächster Schritt</div>`;
  const st = !isOpen(t) ? "" : stale ? `<span class="chip amber">seit ${sd} Tagen still</span>` : `<span class="chip">${sd === 0 ? "heute" : "vor " + sd + " Tagen"}</span>`;
  const rmc = rmOf(t.id).filter(r => !r.bearbeitet).length;
  return `<div class="trow ${late || nk ? "late" : stale ? "stale" : ""}" data-open="${t.id}">
    <span class="prio ${t.prio}">${t.prio}</span>
    <div><div class="tt">${esc(t.titel)}</div><div class="tm">${(t.liegenschaften || []).map(l => `<span class="chip">${esc(l)}</span>`).join("")}${phase}<span>${esc((PHASEN.find(p => p[0] === t.phase) || [0, ""])[1])}</span>${rmc ? `<span class="chip red">${rmc} Rückmeldung${rmc > 1 ? "en" : ""}</span>` : ""}${t.extern_sichtbar ? `<span class="chip violet">extern sichtbar</span>` : ""}</div></div>
    ${who}${nx}<div>${st}</div></div>`;
}

// ---------- Wochenrunde ----------
function renderRunde() {
  const act = S.themen.filter(isOpen);
  const sorted = (a) => a.slice().sort((x, y) => ({ A: 0, B: 1, C: 2 }[x.prio] - { A: 0, B: 1, C: 2 }[y.prio]) || x.titel.localeCompare(y.titel, "de"));
  const item = (t, sub, acts) => `<div class="ri"><div><b>${esc(t.titel)}</b> <span class="prio ${t.prio}" style="display:inline-flex;width:18px;height:18px;font-size:10px;vertical-align:middle">${t.prio}</span><small>${sub}</small></div><div class="a">${acts}</div></div>`;
  const open = id => `<button class="btn sm" data-open="${id}">Akte</button>`;
  const secs = [];
  const l1 = sorted(act.filter(noK));
  secs.push(["1 · Ohne Kümmerer", l1, t => item(t, esc(t.kuemmerer_firma ? "heute nur " + t.kuemmerer_firma : "niemand eingetragen"), `${personSel(`data-k="${t.id}" style="width:190px;padding:3px 6px"`, "", { empty: "– Kümmerer wählen –" })}<button class="btn sm pri" data-ksave="${t.id}">setzen</button>${open(t.id)}`)]);
  const l2 = sorted(act.filter(isLate));
  secs.push(["2 · Überfällig", l2, t => item(t, `<span style="color:var(--red)">seit ${fmt(t.naechster_termin)}</span> · ${esc(t.naechster_schritt || "")}${t.naechster_wer ? " · " + esc(t.naechster_wer) : ""}`, `<button class="btn sm" data-shift="${t.id}:7">+7 Tage</button><button class="btn sm" data-shift="${t.id}:14">+14 Tage</button><button class="btn sm pri" data-done="${t.id}">Erledigt</button>${open(t.id)}`)]);
  const l3 = sorted(act.filter(t => isStale(t) && !isLate(t)));
  secs.push(["3 · Lange nicht bewegt", l3, t => item(t, `seit ${stillDays(t)} Tagen kein Eintrag${t.wiedervorlage ? " · Wiedervorlage war " + fmt(t.wiedervorlage) : ""}`, `<button class="btn sm" data-wv="${t.id}:28">4 Wochen zurückstellen</button>${open(t.id)}`)]);
  const l4 = sorted(act.filter(t => noStep(t)));
  secs.push(["4 · Ohne nächsten Schritt", l4, t => item(t, "Was ist der nächste Schritt?", `<input placeholder="Nächster Schritt" data-step="${t.id}" style="width:230px;padding:3px 6px"><input type="date" data-stepd="${t.id}" style="padding:3px 6px"><button class="btn sm pri" data-stepsave="${t.id}">setzen</button>${open(t.id)}`)]);
  const l5 = sorted(act.filter(wvDue));
  secs.push(["5 · Wiedervorlage fällig", l5, t => item(t, "Wiedervorlage " + fmt(t.wiedervorlage), `<button class="btn sm" data-wv="${t.id}:14">2 Wochen</button><button class="btn sm" data-wv="${t.id}:28">4 Wochen</button>${open(t.id)}`)]);
  const rn = rmOpen().length;
  let html = `<h2>Wochenrunde</h2><p class="sub">Die Runde arbeitet fünf Listen ab. Jede Zeile hat Schnellaktionen. Was erledigt ist, verschwindet aus der Liste.${rn ? ` <a href="#" data-tab="rm" style="color:var(--red);font-weight:700">${rn} Rückmeldung${rn > 1 ? "en" : ""} von Externen warten auf Prüfung</a>` : ""}</p>${dlPeople()}`;
  const total = secs.reduce((a, s) => a + s[1].length, 0);
  secs.forEach(([h, list, fn]) => { html += `<div class="rev"><h3>${h} <span class="chip ${list.length ? "red" : "green"}">${list.length}</span></h3>${list.length ? list.map(fn).join("") : `<div class="note" style="padding:4px 0">Nichts offen.</div>`}</div>`; });
  if (!total) html += `<div class="empty">Alles im grünen Bereich.</div>`;
  $("#p-runde").innerHTML = html;
}

// ---------- Themenakte ----------
let editNext = false;
function renderAkte() {
  const el = $("#p-akte");
  if (!sel || !T(sel)) { const f = S.themen.find(isOpen) || S.themen[0]; sel = f ? f.id : null; }
  const t = T(sel);
  const opts = S.themen.slice().sort((a, b) => (isOpen(b) - isOpen(a)) || a.titel.localeCompare(b.titel, "de")).map(x => `<option value="${x.id}"${x.id === sel ? " selected" : ""}>${esc(x.titel)}${isOpen(x) ? "" : " (" + x.status + ")"}</option>`).join("");
  const pick = `<div class="row2" style="margin-bottom:12px"><span class="note">Thema wählen:</span><select id="akte-sel" style="flex:1;max-width:520px">${opts}</select><button class="btn pri" data-new="1">+ Neues Thema</button></div>`;
  if (!t) { el.innerHTML = pick + `<div class="empty">Noch keine Themen.</div>`; return; }
  const late = isLate(t), ph = Math.max(0, PHASEN.findIndex(p => p[0] === t.phase));
  const bet = betOf(t.id), aps = apOf(t.id), pts = protoPoints(t.id), tds = todosOf(t.id);
  const sumB = aps.reduce((a, x) => a + (Number(x.budget) || 0), 0);
  const eur = n => n == null || n === "" ? "" : Number(n).toLocaleString("de-DE") + " €";

  // Verlauf (Änderungen, Rückmeldungen, Notizen)
  const vl = verlOf(t.id).map(v => ({ d: v.datum, q: v.quelle, x: v.text }))
    .sort((a, b) => String(b.d).localeCompare(String(a.d)));
  const tl = vl.slice(0, 40).map(v => `<div class="${/Protokoll|Workshop/.test(v.q) ? "" : "info"}"><b>${fmt(v.d)}</b> · ${esc(v.q)}<small>${esc(v.x)}</small></div>`).join("") || `<div class="note">Noch kein Verlauf.</div>`;

  const nxView = t.naechster_schritt ? `<div class="tx">${esc(t.naechster_schritt)}</div><div>${esc(t.naechster_wer || "niemand zugeordnet")}${t.naechster_termin ? " · bis <b>" + fmt(t.naechster_termin) + "</b>" + (late ? " (überfällig)" : "") : " · <span style='color:var(--amber)'>ohne Termin</span>"}</div>
      <div class="acts"><button class="btn sm" data-shiftb="7">+7 Tage</button><button class="btn sm" data-shiftb="14">+14 Tage</button><button class="btn sm pri" data-donebtn="1">✓ Erledigt</button><button class="btn sm" data-editnext="1">Bearbeiten</button></div>`

// ---------- Protokollpunkte (alle aufgenommenen Punkte, mit Zuordnung) ----------
let fPkt = "ohne";
const PKT_STOP = new Set(["thema", "themen", "punkt", "punkte", "sollen", "werden", "wurde", "wurden", "haben", "dieser", "diese", "dieses", "einer", "einen", "einem", "noch", "durch", "damit", "danach", "bitte", "alle", "nicht", "sowie", "ohne", "oder", "wenn", "dann", "über", "unter", "nach", "weiter", "weitere", "klären", "prüfen", "abstimmen"]);
const stems = s => new Set(String(s || "").toLowerCase().replace(/[^a-zäöüß0-9\s-]/g, " ").split(/[\s-]+/).filter(w => w.length >= 5 && !PKT_STOP.has(w)).map(w => w.slice(0, 6)));
function allPoints() {
  const out = [];
  S.proto.slice().sort((a, b) => String((b.meta || {}).datum || "").localeCompare(String((a.meta || {}).datum || ""))).forEach(p => {
    const secs = p.secs || [], labels = {}; secs.forEach(s => labels[s.key] = s.label);
    const keys = secs.map(s => s.key).concat(Object.keys(p.rows || {}).filter(k => !labels[k]));
    keys.forEach(k => (p.rows[k] || []).forEach(r => {
      if (!r || !r._rid || !(String(r.titel || "").trim() || String(r.inhalt || "").trim())) return;
      out.push({ pid: p.id, datum: (p.meta && p.meta.datum) || "", nr: p.meta && p.meta.nr, typ: (p.meta && p.meta.typ) || "", sec: labels[k] || "", row: r });
    }));
  });
  return out;
}
const pktOhne = () => allPoints().filter(x => !x.row.themaId);
function pktVorschlag(x) {
  const ps = stems((x.row.titel || "") + " " + (x.row.inhalt || ""));
  let best = null, sc = 0;
  S.themen.filter(isOpen).forEach(t => { let n = 0; stems(t.titel).forEach(w => { if (ps.has(w)) n += 2; }); stems(t.worum).forEach(w => { if (ps.has(w)) n += 0.5; }); if (n > sc) { sc = n; best = t; } });
  return sc >= 2 ? best : null;
}
const protoLabel = x => fmt(x.datum) + (x.typ ? " · " + x.typ : "") + (x.nr && x.nr !== "NaN" && x.nr !== "-" ? " · Nr. " + x.nr : "");
function shortTxt(s, n) { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function ptMeta(r) { return [r.verantwortlich ? esc(r.verantwortlich) : "", r.termin ? "bis " + fmt(r.termin) : "", r.status ? `<span class="chip">${esc(r.status)}</span>` : ""].filter(Boolean).join(" · "); }
function themaOptions(cur) {
  const o = S.themen.filter(t => isOpen(t) || t.id === cur).sort((a, b) => a.titel.localeCompare(b.titel, "de"));
  return o.map(t => `<option value="${t.id}"${t.id === cur ? " selected" : ""}>${esc(t.titel)}</option>`).join("");
}
function renderPkt() {
  const el = $("#p-pkt"), all = allPoints(), un = all.filter(x => !x.row.themaId);
  const list = fPkt === "ohne" ? un : all;
  const filt = `<div class="filters" style="margin:0 0 10px"><span class="chip${fPkt === "ohne" ? " on" : ""}" data-pkf="ohne">Ohne Thema (${un.length})</span><span class="chip${fPkt === "alle" ? " on" : ""}" data-pkf="alle">Alle Punkte (${all.length})</span></div>`;
  if (!S.proto.length) { el.innerHTML = `<h2>Protokollpunkte</h2><div class="empty">Keine Protokolle zu diesem Projekt gefunden.</div>`; return; }
  const groups = [];
  list.forEach(x => { let g = groups[groups.length - 1]; if (!g || g.pid !== x.pid) { g = { pid: x.pid, label: protoLabel(x), items: [] }; groups.push(g); } g.items.push(x); });
  const body = groups.map(g => `<div class="blk"><h3>${esc(g.label)} · ${g.items.length} Punkt${g.items.length === 1 ? "" : "e"}</h3>${g.items.map(x => {
    const r = x.row, th = r.themaId ? T(r.themaId) : null, vs = th ? null : pktVorschlag(x);
    return `<div class="ptr pk" data-pp="${esc(x.pid)}" data-pr="${esc(r._rid)}"><div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:260px">${x.sec ? `<small style="display:inline">${esc(x.sec)}</small>` : ""}<div><b>${esc(r.titel || shortTxt(r.inhalt, 70))}</b></div>${r.titel && r.inhalt ? `<div class="note" style="margin:2px 0" title="${esc(shortTxt(r.inhalt, 1200))}">${esc(shortTxt(r.inhalt, 260))}</div>` : ""}<small>${ptMeta(r)}</small></div>
      <div style="flex:none;width:280px;max-width:100%"><select data-pkset="1" style="width:100%"><option value="">– Thema zuordnen –</option>${themaOptions(r.themaId)}</select>
      <div class="acts" style="margin-top:4px">${th ? `<button class="btn sm ghost" data-open="${th.id}">Thema öffnen</button>` : `${vs ? `<button class="btn sm" data-pkas="${vs.id}" title="Vorschlag nach Stichworten">→ ${esc(shortTxt(vs.titel, 32))}</button>` : ""}<button class="btn sm ghost" data-pknew="1">+ Neues Thema</button>`}</div></div></div></div>`;
  }).join("")}</div>`).join("");
  el.innerHTML = `<h2>Protokollpunkte</h2><p class="sub">Alle Punkte aus den Protokollen dieses Projekts. Eine Zuordnung wird sofort im Protokoll gespeichert und dort als Link zum Thema angezeigt. Protokolle nur für die Geschäftsführung sind hier nicht enthalten.</p>${filt}${body || `<div class="empty">${fPkt === "ohne" ? "Alle Punkte sind einem Thema zugeordnet." : "Keine Punkte."}</div>`}`;
}

// ---------- Personen (gemeinsame Quelle mit dem Statusboard) ----------
// Eine neue Person wird in der zentralen Kontaktliste und als Ansprechpartner des Projekts angelegt,
// erscheint also auch im Statusboard. Ein Duplikat wird nie erzeugt: gleicher Name = gleiche Person.
async function createPerson(o) {
  const name = (o.name || "").trim(); if (!name) throw new Error("Name fehlt");
  let k = S.kont.find(x => norm(x.name) === norm(name));
  if (!k) {
    const r = await api("kontakte", { method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify([{ name, firma: (o.firma || "").trim() || null, email: (o.email || "").trim() || null, telefon: (o.telefon || "").trim() || null }]) });
    k = r[0]; S.kont.push(k);
  } else {
    const patch = {}; if (!k.firma && o.firma) patch.firma = o.firma.trim(); if (!k.email && o.email) patch.email = o.email.trim(); if (!k.telefon && o.telefon) patch.telefon = o.telefon.trim();
    if (Object.keys(patch).length) { const r = await api("kontakte?id=eq." + k.id, { method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify(patch) }); if (r && r[0]) Object.assign(k, r[0]); }
  }
  if (!S.apers.some(a => a.kontakt_id === k.id)) {
    const gw = o.gewerk || (PL_INNOTECH.includes(name) ? "PL INNOTECH" : "Sonstiges");
    const r = await api("projekt_ansprechpartner", { method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify([{ projekt_id: PROJ, kontakt_id: k.id, gewerk: gw, pos: S.apers.length }]) });
    if (r && r[0]) S.apers.push(r[0]);
  }
  return k;
}
async function ensurePerson(name) {
  name = (name || "").trim(); if (!name) return;
  const k = S.kont.find(x => norm(x.name) === norm(name));
  if (k && S.apers.some(a => a.kontakt_id === k.id)) return;
  await createPerson({ name, firma: firmaOf(name) });
}

async function ensureSession() {

  try {
    const r = await fetch(SB + "/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: session.refresh_token }) });
    if (!r.ok) throw new Error("expired");
    saveSession(await r.json());
  } catch (e) { session = null; zugaenge = null; try { sessionStorage.removeItem("themen-session"); } catch (x) { } }
}
function saveSession(j) {
  session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || (Math.floor(Date.now() / 1000) + (j.expires_in || 3600)), email: (j.user && j.user.email) || (session && session.email) || "" };
  try { sessionStorage.setItem("themen-session", JSON.stringify(session)); } catch (e) { }
}
async function login(email, pw) {

  if (!r.ok) throw new Error("Anmeldung fehlgeschlagen: falsche E-Mail oder falsches Passwort.");

  if (el.dataset && el.dataset.pkadd) { if (!el.value) return; const [pid, rid] = el.value.split("|"); return guard(() => assignPoint(pid, rid, sel)); }

  if (el.id === "zu-from") { const from = el.value; el.value = ""; if (!from) return; const tt = T(sel), ft = T(from); if (tt.kuemmerer && ft.kuemmerer && norm(tt.kuemmerer) !== norm(ft.kuemmerer) && !confirm("Kümmerer " + tt.kuemmerer + " wird durch " + ft.kuemmerer + " ersetzt. Fortfahren?")) return; return guard(() => copyZust(from, sel)); }
  if (el.id === "akte-sel") { sel = el.value; editNext = false; return render(); }
  const t = T(sel);
  if (el.dataset && el.dataset.f && t) {
    const f = el.dataset.f; let v = el.value.trim();
    if (f === "titel") { if (!v) { el.value = t.titel; return; } return guard(() => patchThema(sel, { titel: v })); }
    if (f === "liegenschaften") return guard(() => patchThema(sel, { liegenschaften: v.split(",").map(s => s.trim()).filter(Boolean) }));
    if (f === "kuemmerer") return setKuemmerer(sel, v);
    if (f === "wiedervorlage") return guard(() => patchThema(sel, { wiedervorlage: v || null }, v ? "Wiedervorlage " + fmt(v) : null));
    return guard(() => patchThema(sel, { [f]: v || null }));
  }
  const tr = el.closest && el.closest("[data-ap]");
  if (tr && el.dataset.apf) {
    const id = tr.dataset.ap, f = el.dataset.apf; let v = el.value.trim(); const body = {};
    if (f === "budget") { v = v.replace(/[€\s]/g, ""); if (v.includes(",")) v = v.replace(/\./g, "").replace(",", "."); else v = v.replace(/\.(?=\d{3}\b)/g, ""); const n = parseFloat(v); body.budget = v === "" || isNaN(n) ? null : n; }
    else if (f === "inhalt") body.inhalt = v; else body[f] = v || null;
    return guard(async () => { const r = await api("thema_ap?id=eq." + id, { method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify(body) }); const a = S.ap.find(y => y.id === id); if (r && r[0]) Object.assign(a, r[0]); const th = T(a.thema_id); if (th) th.letzte_bewegung = new Date().toISOString(); });
  }
  if (el.dataset && el.dataset.todo) return guard(async () => { const st = el.checked ? "erledigt" : "offen"; await api("projekt_todos?id=eq." + el.dataset.todo, { method: "PATCH", body: JSON.stringify({ status: st }) }); const x = S.todos.find(y => y.id === el.dataset.todo); x.status = st; x.updated_at = new Date().toISOString(); });
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "zug-login") return;
  e.preventDefault(); const er = $("#zl-err"); er.textContent = "";
  try { await login($("#zl-e").value.trim(), $("#zl-p").value); zugaenge = null; render(); } catch (x) { er.textContent = x.message; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#modal2").classList.contains("on")) closeModal2(); else closeModal(); } if (e.key === "Enter" && e.target.id === "pn-n") { e.preventDefault(); personOk(); } if (e.key === "Enter" && e.target.id && /^m-[stwd]$/.test(e.target.id)) { const b = $("#modal [data-m]:not([data-m=close])"); if (b) b.click(); } });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
$("#modal2").addEventListener("click", e => { if (e.target.id === "modal2") closeModal2(); });

function editing() {
  const a = document.activeElement;
  return $("#modal").classList.contains("on") || $("#modal2").classList.contains("on") || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest(".panel"));
}
(async function init() {
  try { const s = JSON.parse(sessionStorage.getItem("themen-session") || "null"); if (s && s.expires_at > Date.now() / 1000) session = s; } catch (e) { }
  const h = location.hash.match(/thema=([0-9a-f-]{36})/);
  await loadAll();
  if (h && T(h[1])) { sel = h[1]; tab = "akte"; }
  setTab(tab);
  window.addEventListener("hashchange", () => { const m = location.hash.match(/thema=([0-9a-f-]{36})/); if (m && T(m[1])) { sel = m[1]; editNext = false; setTab("akte"); } });
  setInterval(async () => { if (document.hidden || editing()) return; if (await loadAll(true)) render(); }, 45000);
})();
